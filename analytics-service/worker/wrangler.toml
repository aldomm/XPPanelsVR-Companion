# Owner-approved deployments use the Cloudflare Dashboard. Keep the secret out of this file.
name = "xppanels-download-analytics"
account_id = "9be103bd6e0f65c974d8754b9ef45cbb"
main = "src/index.mjs"
compatibility_date = "2026-11-06"
workers_dev = true
upload_source_maps = false
